# Full grid, as reported in the paper. Requires a machine with >= 8 cores and
# roughly 40 GB of scratch space. Expect several hours.
repetitions: 7
warmup: 1

workloads:
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 0.0, hot_dim_multiplier: 1, hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 0.5, hot_dim_multiplier: 1, hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 0.9, hot_dim_multiplier: 1, hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 1.2, hot_dim_multiplier: 1, hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 1.5, hot_dim_multiplier: 1, hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 1.5, hot_dim_multiplier: 16,  hot_keys: 1, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 1.5, hot_dim_multiplier: 16,  hot_keys: 10, n_sensors: 21, seed: 20260818}
  - {n_fact: 50000000, n_dim: 250000, n_engines: 5000, theta: 1.5, hot_dim_multiplier: 16,  hot_keys: 100, n_sensors: 21, seed: 20260818}

spark:
  - {master: "local[8]", driver_memory: "24g", shuffle_partitions: 200, aqe_enabled: false, autobroadcast_threshold: -1, skewed_partition_threshold: "256MB", skewed_partition_factor: 5}
  - {master: "local[8]", driver_memory: "24g", shuffle_partitions: 200, aqe_enabled: true,  autobroadcast_threshold: -1, skewed_partition_threshold: "256MB", skewed_partition_factor: 5}
  - {master: "local[8]", driver_memory: "24g", shuffle_partitions: 200, aqe_enabled: true,  autobroadcast_threshold: -1, skewed_partition_threshold: "64MB",  skewed_partition_factor: 2}

arms:
  - {name: baseline,       k: [1]}
  - {name: aqe,            k: [1]}
  - {name: salt_selective, k: [1, 2, 4, 8, 16, 24, 32, 48, 64]}
  - {name: salt_uniform,   k: [2, 4, 8, 16, 32, 64]}
  - {name: aqe_salt,       k: [2, 4, 8, 16, 32]}
